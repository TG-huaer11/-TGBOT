<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
    <!-- Layui CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.8.3/dist/css/layui.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-page {
            width: 100%;
            max-width: 400px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .banner {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .form-view {
            padding: 20px;
        }

        .input-with-icon {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #f0f3f6;
            padding: 5px 0;
            margin-bottom: 10px;
        }

        .input-with-icon img {
            width: 22px;
            height: 22px;
            margin-right: 10px;
        }

        .v-input {
            flex: 1;
            padding: 10px;
            border: none;
            font-size: 14px;
            outline: none;
        }

        .checkbox-group {
            margin-top: 20px;
            display: flex;
            align-items: center;
        }

        .checkbox-group input {
            margin-right: 10px;
        }

        .checkbox-txt {
            margin-left: 5px;
            font-weight: bold;
        }

        .but {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: #000;
            color: #fff;
            border: none;
            border-radius: 24px;
            font-size: 15px;
            cursor: pointer;
        }

        .txt-tip {
            text-align: center;
            font-size: 15px;
            font-weight: bold;
            color: #fe2b54;
            margin-top: 15px;
            cursor: pointer;
        }
        
                      .language-selector {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
        }

        .language-button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #000;
        }

        .language-dropdown {
            display: none;
            position: absolute;
            right: 0;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }

        .language-dropdown.show {
            display: block;
        }

        .language-item {
            padding: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .language-item img {
            width: 20px;
            height: 20px;
            margin-right: 10px;
        }

        .language-item:hover {
            background-color: #f5f5f5;
        }
        
    </style>
</head>
<body>

        <div class="language-selector">
            <button class="language-button" onclick="toggleLanguageDropdown()" style="font-size:25px">   <img src="/assets/lang.png" width="30"/></button>
            <div class="language-dropdown" id="languageDropdown">
                <!-- Language items will be dynamically inserted here -->
            </div>
        </div>

        <!-- Top Banner -->
        <img class="banner" src="/h5/static/images/banner.png" alt="Banner">

                <input class="v-input" type="password" id="pay_password" placeholder="Enter payment password" maxlength="6">

                <input class="v-input" type="text" id="invite_code" placeholder="Enter invitation code" maxlength="10">
            </div>

            <!-- Agreement Checkbox -->
            <div class="checkbox-group">
                <input type="checkbox" id="agree" checked>
                <label for="agree" id="agreeText">I have read and agree to the <span class="checkbox-txt" id="privacyPolicy">Privacy Policy</span></label>
            </div>

            <!-- Register Button -->
            <button class="but" onclick="register()" id="registerButton">Register</button>

            <!-- Jump to Login Page -->
            <div class="txt-tip" onclick="window.location.href='login.html'" id="loginLink">Already have an account? Log in</div>
        </div>
    </div>

    <!-- Layui JS -->
    <script src="https://cdn.jsdelivr.net/npm/layui@2.8.3/dist/layui.min.js"></script>
    <script>
        // Language List
        const langList = [
            { name: 'Deutsch', value: 'de', image: '/h5/static/images/de.png' },
            { name: 'English', value: 'en', image: '/h5/static/images/en.png' },
            { name: 'Français', value: 'fr', image: '/h5/static/images/fr.png' },
            { name: 'Italiano', value: 'it', image: '/h5/static/images/it.png' },
            { name: 'Português', value: 'pt', image: '/h5/static/images/pt.jpg' },
            { name: 'Русский', value: 'ru', image: '/h5/static/images/ru.png' },
            { name: 'Español', value: 'spa', image: '/h5/static/images/spa.png' },
            { name: '中文', value: 'zh', image: '/h5/static/images/cn.png' },
            { name: 'Türkçe', value: 'tr', image: '/h5/static/images/tr.png' },
            { name: 'عربي', value: 'ar', image: '/h5/static/images/ar.png' },
        ];

        // Language Text Mapping
        const languageText = {
            en: {
                usernamePlaceholder: 'Enter username',
                passwordPlaceholder: 'Enter password',
                payPasswordPlaceholder: 'Enter payment password',
                inviteCodePlaceholder: 'Enter invitation code',
                agreeText: 'I have read and agree to the',
                privacyPolicy: 'Privacy Policy',
                registerButton: 'Register',
                loginLink: 'Already have an account? Log in',
            },
            de: {
                usernamePlaceholder: 'Benutzername eingeben',
                passwordPlaceholder: 'Passwort eingeben',
                payPasswordPlaceholder: 'Zahlungspasswort eingeben',
                inviteCodePlaceholder: 'Einladungscode eingeben',
                agreeText: 'Ich habe gelesen und stimme zu',
                privacyPolicy: 'Datenschutzrichtlinie',
                registerButton: 'Registrieren',
                loginLink: 'Haben Sie bereits ein Konto? Anmelden',
            },
            fr: {
                usernamePlaceholder: 'Entrez votre nom d\'utilisateur',
                passwordPlaceholder: 'Entrez votre mot de passe',
                payPasswordPlaceholder: 'Entrez votre mot de passe de paiement',
                inviteCodePlaceholder: 'Entrez votre code d\'invitation',
                agreeText: 'J\'ai lu et accepté',
                privacyPolicy: 'Politique de confidentialité',
                registerButton: 'S\'inscrire',
                loginLink: 'Vous avez déjà un compte? Se connecter',
            },
            it: {
                usernamePlaceholder: 'Inserisci il nome utente',
                passwordPlaceholder: 'Inserisci la password',
                payPasswordPlaceholder: 'Inserisci la password di pagamento',
                inviteCodePlaceholder: 'Inserisci il codice di invito',
                agreeText: 'Ho letto e accetto',
                privacyPolicy: 'Informativa sulla privacy',
                registerButton: 'Registrati',
                loginLink: 'Hai già un account? Accedi',
            },
            pt: {
                usernamePlaceholder: 'Insira o nome de usuário',
                passwordPlaceholder: 'Insira a senha',
                payPasswordPlaceholder: 'Insira a senha de pagamento',
                inviteCodePlaceholder: 'Insira o código de convite',
                agreeText: 'Eu li e concordo com a',
                privacyPolicy: 'Política de Privacidade',
                registerButton: 'Registrar',
                loginLink: 'Já tem uma conta? Faça login',
            },
            ru: {
                usernamePlaceholder: 'Введите имя пользователя',
                passwordPlaceholder: 'Введите пароль',
                payPasswordPlaceholder: 'Введите платежный пароль',
                inviteCodePlaceholder: 'Введите код приглашения',
                agreeText: 'Я прочитал и согласен с',
                privacyPolicy: 'Политикой конфиденциальности',
                registerButton: 'Зарегистрироваться',
                loginLink: 'Уже есть аккаунт? Войти',
            },
            spa: {
                usernamePlaceholder: 'Ingrese su nombre de usuario',
                passwordPlaceholder: 'Ingrese su contraseña',
                payPasswordPlaceholder: 'Ingrese su contraseña de pago',
                inviteCodePlaceholder: 'Ingrese su código de invitación',
                agreeText: 'He leído y acepto la',
                privacyPolicy: 'Política de Privacidad',
                registerButton: 'Registrarse',
                loginLink: '¿Ya tienes una cuenta? Iniciar sesión',
            },
            zh: {
                usernamePlaceholder: '输入用户名',
                passwordPlaceholder: '输入密码',
                payPasswordPlaceholder: '输入支付密码',
                inviteCodePlaceholder: '输入邀请码',
                agreeText: '我已阅读并同意',
                privacyPolicy: '隐私政策',
                registerButton: '注册',
                loginLink: '已有账号？登录',
            },
            tr: {
                usernamePlaceholder: 'Kullanıcı adınızı girin',
                passwordPlaceholder: 'Şifrenizi girin',
                payPasswordPlaceholder: 'Ödeme şifrenizi girin',
                inviteCodePlaceholder: 'Davet kodunu girin',
                agreeText: 'Okudum ve kabul ediyorum',
                privacyPolicy: 'Gizlilik Politikası',
                registerButton: 'Kayıt Ol',
                loginLink: 'Zaten bir hesabınız var mı? Giriş yap',
            },
            ar: {
                usernamePlaceholder: 'أدخل اسم المستخدم',
                passwordPlaceholder: 'أدخل كلمة المرور',
                payPasswordPlaceholder: 'أدخل كلمة مرور الدفع',
                inviteCodePlaceholder: 'أدخل رمز الدعوة',
                agreeText: 'لقد قرأت وأوافق على',
                privacyPolicy: 'سياسة الخصوصية',
                registerButton: 'تسجيل',
                loginLink: 'هل لديك حساب بالفعل؟ تسجيل الدخول',
            },
        };

  var f=true;
        // Function to toggle language dropdown
        function toggleLanguageDropdown() {
            const dropdown = document.getElementById('languageDropdown');
          
           if(f){
              dropdown.style.display='block';  
              f=false;
           }else{
                dropdown.style.display='none';
                f=true
           }
        }

        // Function to set language
        function setLanguage(item) {
            localStorage.setItem('lang', item.value); // Save selected language
            updatePageLanguage(item.value); // Update page content
            layui.layer.msg(`Language set to ${item.name}`, { icon: 1 }); // Show success message
            toggleLanguageDropdown(); // Hide dropdown
        }

        // Function to update page language
          function updatePageLanguage(lang) {
            const texts = languageText[lang] || languageText.en; // Default to English if language not found

            // Update input placeholders
            document.getElementById('username').placeholder = texts.usernamePlaceholder;
            document.getElementById('password').placeholder = texts.passwordPlaceholder;
            document.getElementById('pay_password').placeholder = texts.payPasswordPlaceholder;
            document.getElementById('invite_code').placeholder = texts.inviteCodePlaceholder;

            // Update agreement text
            document.getElementById('agreeText').innerHTML = `${texts.agreeText} <span class="checkbox-txt">${texts.privacyPolicy}</span>`;

            // Update button text
            document.getElementById('registerButton').textContent = texts.registerButton;

            // Update login link text
            document.getElementById('loginLink').textContent = texts.loginLink;
        }

        // Populate language dropdown
        const dropdown = document.getElementById('languageDropdown');
        langList.forEach(item => {
            const div = document.createElement('div');
            div.className = 'language-item';
            div.onclick = () => setLanguage(item);
            div.innerHTML = `<img src="${item.image}" alt="${item.name}">${item.name}`;
            dropdown.appendChild(div);
        });

        // Close the dropdown if the user clicks outside of it
        window.onclick = function (event) {
            if (!event.target.matches('.language-button')) {
                const dropdowns = document.getElementsByClassName('language-dropdown');
                for (let i = 0; i < dropdowns.length; i++) {
                    const openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        };

        // Set default language
        const defaultLang = localStorage.getItem('lang') || 'en'; // Default to English
        updatePageLanguage(defaultLang);

        // Initialize Layui
        layui.use('layer', function () {
            const layer = layui.layer;

            function register() {
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const payPassword = document.getElementById('pay_password').value;
                const inviteCode = document.getElementById('invite_code').value;
                const agree = document.getElementById('agree').checked;

                // Simple front-end validation
                if (!username) {
                    layer.msg('Please enter your username!', { icon: 2 }); // Warning icon
                    return;
                }
                if (!password) {
                    layer.msg('Please enter your password!', { icon: 2 }); // Warning icon
                    return;
                }
                if (!payPassword) {
                    layer.msg('Please enter your payment password!', { icon: 2 }); // Warning icon
                    return;
                }
                if (!inviteCode) {
                    layer.msg('Please enter your invitation code!', { icon: 2 }); // Warning icon
                    return;
                }
                if (!agree) {
                    layer.msg('Please read and agree to the Privacy Policy!', { icon: 2 }); // Warning icon
                    return;
                }

                // Simulate registration request
                fetch('/user/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        tel: username,
                        deposit_pwd: payPassword,
                        pwd: password,
                        invite_code: inviteCode,
                    }),
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.code === 1) {
                            layer.msg('Registration successful!', { icon: 1 }); // Success icon
                            setTimeout(() => {
                                window.location.href = 'login.html'; // Redirect to login page
                            }, 2000);
                        } else {
                            layer.msg(data.msg || 'Registration failed!', { icon: 2 }); // Error icon
                        }
                    })
                    .catch(error => {
                        console.error('Registration request failed:', error);
                        layer.msg('Registration request failed. Please try again later!', { icon: 2 }); // Error icon
                    });
            }

            // Expose register function to global scope
            window.register = register;
        });
    </script>
</body>
</html>
