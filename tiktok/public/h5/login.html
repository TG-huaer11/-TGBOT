<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <!-- Layui CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.8.3/dist/css/layui.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-page {
            width: 100%;
            max-width: 400px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .banner {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .form-view {
            padding: 20px;
        }

        .txt {
            text-align: center;
            font-size: 15px;
            font-weight: bold;
            color: #000000e6;
            margin-bottom: 10px;
        }

        .login {
            font-size: 30px;
            margin-bottom: 20px;
        }

        .v-input {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .but {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: #000;
            color: #fff;
            border: none;
            border-radius: 24px;
            font-size: 15px;
            cursor: pointer;
        }

        .but-login {
            margin-top: 30px;
        }

        .txt-tip {
            text-align: center;
            font-size: 15px;
            font-weight: bold;
            color: #fe2b54;
            margin-top: 15px;
            cursor: pointer;
        }
        
              .language-selector {
            position: absolute;
            top:10px;
            right: 10px;
            z-index: 1000;
        }

        .language-button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #000;
        }

        .language-dropdown {
            display: none;
            position: absolute;
            right: 0;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }

        .language-dropdown.show {
            display: block;
        }

        .language-item {
            padding: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .language-item img {
            width: 20px;
            height: 20px;
            margin-right: 10px;
        }

        .language-item:hover {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>
    <div class="login-page" style="">
        <!-- Language Selector -->
        <div class="language-selector">
            <button class="language-button" onclick="toggleLanguageDropdown()" style="font-size:25px">
                <img src="/assets/lang.png" width="30"/>
            </button>
            <div class="language-dropdown" id="languageDropdown">
                <!-- Language items will be dynamically inserted here -->
            </div>
        </div>

        <!-- Top Banner -->
        <img class="banner" src="/h5/static/images/banner.png" alt="Banner">

        <!-- Login Form -->
        <div class="form-view">
            <div class="txt login" id="loginTitle">Login</div>
            <div class="txt" id="loginSubtitle">Please enter your username and password</div>

            <!-- Username Input -->
            <input class="v-input" type="text" id="phone" placeholder="Enter username">

            <!-- Password Input -->
            <input class="v-input" type="password" id="password" placeholder="Enter password">

            <!-- Login Button -->
            <button class="but but-login" onclick="login()" id="loginButton">Login</button>

            <!-- Register Button -->
            <button class="but" onclick="window.location.href='reg.html'" id="registerButton">Register</button>

            <!-- Forgot Password -->
            <div class="txt-tip" onclick="window.location.href='/kefu.html'" id="forgotPassword">Forgot password?</div>
        </div>
    </div>

    <!-- Layui JS -->
    <script src="https://cdn.jsdelivr.net/npm/layui@2.8.3/dist/layui.min.js"></script>
    <script>
        // Language List
        const langList = [
            { name: 'Deutsch', value: 'de', image: '/h5/static/images/de.png' },
            { name: 'English', value: 'en', image: '/h5/static/images/en.png' },
            { name: 'Français', value: 'fr', image: '/h5/static/images/fr.png' },
            { name: 'Italiano', value: 'it', image: '/h5/static/images/it.png' },
            { name: 'Português', value: 'pt', image: '/h5/static/images/pt.jpg' },
            { name: 'Русский', value: 'ru', image: '/h5/static/images/ru.png' },
            { name: 'Español', value: 'spa', image: '/h5/static/images/spa.png' },
            { name: '中文', value: 'zh', image: '/h5/static/images/cn.png' },
            { name: 'Türkçe', value: 'tr', image: '/h5/static/images/tr.png' },
            { name: 'عربي', value: 'ar', image: '/h5/static/images/ar.png' },
        ];

        // Language Text Mapping
        const languageText = {
            en: {
                loginTitle: 'Login',
                loginSubtitle: 'Please enter your username and password',
                usernamePlaceholder: 'Enter username',
                passwordPlaceholder: 'Enter password',
                loginButton: 'Login',
                registerButton: 'Register',
                forgotPassword: 'Forgot password?',
            },
            de: {
                loginTitle: 'Anmeldung',
                loginSubtitle: 'Bitte geben Sie Ihren Benutzernamen und Ihr Passwort ein',
                usernamePlaceholder: 'Benutzername eingeben',
                passwordPlaceholder: 'Passwort eingeben',
                loginButton: 'Anmelden',
                registerButton: 'Registrieren',
                forgotPassword: 'Passwort vergessen?',
            },
            fr: {
                loginTitle: 'Connexion',
                loginSubtitle: 'Veuillez entrer votre nom d\'utilisateur et votre mot de passe',
                usernamePlaceholder: 'Entrez votre nom d\'utilisateur',
                passwordPlaceholder: 'Entrez votre mot de passe',
                loginButton: 'Connexion',
                registerButton: 'S\'inscrire',
                forgotPassword: 'Mot de passe oublié?',
            },
            it: {
                loginTitle: 'Accesso',
                loginSubtitle: 'Inserisci il tuo nome utente e la tua password',
                usernamePlaceholder: 'Inserisci il nome utente',
                passwordPlaceholder: 'Inserisci la password',
                loginButton: 'Accedi',
                registerButton: 'Registrati',
                forgotPassword: 'Password dimenticata?',
            },
            pt: {
                loginTitle: 'Login',
                loginSubtitle: 'Por favor, insira seu nome de usuário e senha',
                usernamePlaceholder: 'Insira o nome de usuário',
                passwordPlaceholder: 'Insira a senha',
                loginButton: 'Entrar',
                registerButton: 'Registrar',
                forgotPassword: 'Esqueceu a senha?',
            },
            ru: {
                loginTitle: 'Вход',
                loginSubtitle: 'Пожалуйста, введите ваше имя пользователя и пароль',
                usernamePlaceholder: 'Введите имя пользователя',
                passwordPlaceholder: 'Введите пароль',
                loginButton: 'Войти',
                registerButton: 'Зарегистрироваться',
                forgotPassword: 'Забыли пароль?',
            },
            spa: {
                loginTitle: 'Iniciar sesión',
                loginSubtitle: 'Por favor, ingrese su nombre de usuario y contraseña',
                usernamePlaceholder: 'Ingrese su nombre de usuario',
                passwordPlaceholder: 'Ingrese su contraseña',
                loginButton: 'Iniciar sesión',
                registerButton: 'Registrarse',
                forgotPassword: '¿Olvidó su contraseña?',
            },
            zh: {
                loginTitle: '登录',
                loginSubtitle: '请输入您的用户名和密码',
                usernamePlaceholder: '输入用户名',
                passwordPlaceholder: '输入密码',
                loginButton: '登录',
                registerButton: '注册',
                forgotPassword: '忘记密码？',
            },
            tr: {
                loginTitle: 'Giriş',
                loginSubtitle: 'Lütfen kullanıcı adınızı ve şifrenizi girin',
                usernamePlaceholder: 'Kullanıcı adınızı girin',
                passwordPlaceholder: 'Şifrenizi girin',
                loginButton: 'Giriş Yap',
                registerButton: 'Kayıt Ol',
                forgotPassword: 'Şifremi Unuttum?',
            },
            ar: {
                loginTitle: 'تسجيل الدخول',
                loginSubtitle: 'الرجاء إدخال اسم المستخدم وكلمة المرور',
                usernamePlaceholder: 'أدخل اسم المستخدم',
                passwordPlaceholder: 'أدخل كلمة المرور',
                loginButton: 'تسجيل الدخول',
                registerButton: 'تسجيل',
                forgotPassword: 'هل نسيت كلمة السر؟',
            },
        };
var f=true;
        // Function to toggle language dropdown
        function toggleLanguageDropdown() {
            const dropdown = document.getElementById('languageDropdown');
          
           if(f){
              dropdown.style.display='block';  
              f=false;
           }else{
                dropdown.style.display='none';
                f=true
           }
        }

        // Function to set language
        function setLanguage(item) {
            localStorage.setItem('lang', item.value); // Save selected language
            updatePageLanguage(item.value); // Update page content
            layui.layer.msg(`Language set to ${item.name}`, { icon: 1 }); // Show success message
            toggleLanguageDropdown(); // Hide dropdown
        }

        // Function to update page language
        function updatePageLanguage(lang) {
            const texts = languageText[lang] || languageText.en; // Default to English if language not found
            document.getElementById('loginTitle').textContent = texts.loginTitle;
            document.getElementById('loginSubtitle').textContent = texts.loginSubtitle;
            document.getElementById('phone').placeholder = texts.usernamePlaceholder;
            document.getElementById('password').placeholder = texts.passwordPlaceholder;
            document.getElementById('loginButton').textContent = texts.loginButton;
            document.getElementById('registerButton').textContent = texts.registerButton;
            document.getElementById('forgotPassword').textContent = texts.forgotPassword;
        }





      // Populate language dropdown
            const dropdown = document.getElementById('languageDropdown');
            langList.forEach(item => {
                const div = document.createElement('div');
                div.className = 'language-item';
                div.onclick = () => setLanguage(item);
                div.innerHTML = `<img src="${item.image}" alt="${item.name}">${item.name}`;
                dropdown.appendChild(div);
            });

            // Close the dropdown if the user clicks outside of it
            window.onclick = function (event) {
                if (!event.target.matches('.language-button')) {
                    const dropdowns = document.getElementsByClassName('language-dropdown');
                    for (let i = 0; i < dropdowns.length; i++) {
                        const openDropdown = dropdowns[i];
                        if (openDropdown.classList.contains('show')) {
                            openDropdown.classList.remove('show');
                        }
                    }
                }
            };

            // Set default language
            const defaultLang = localStorage.getItem('lang') || 'en'; // Default to English
            updatePageLanguage(defaultLang);
















        // Initialize Layui
        layui.use('layer', function () {
            const layer = layui.layer;

      

            // Login function
            function login() {
                const phone = document.getElementById('phone').value;
                const password = document.getElementById('password').value;

                if (!phone) {
                    layer.msg('Please enter your username!', { icon: 2 });
                    return;
                }
                if (!password) {
                    layer.msg('Please enter your password!', { icon: 2 });
                    return;
                }

                fetch('/user/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: phone,
                        pwd: password,
                    }),
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.code === 1) {
                            setCookie('username', phone, 7);
                            layer.msg('Login successful!', { icon: 1 });
                            setTimeout(() => {
                                window.location.href = 'main.php';
                            }, 2000);
                        } else {
                            layer.msg(data.msg || 'Login failed!', { icon: 2 });
                        }
                    })
                    .catch(error => {
                        console.error('Login request failed:', error);
                        layer.msg('Login request failed. Please try again later!', { icon: 2 });
                    });
            }

            function setCookie(name, value, days) {
                const date = new Date();
                date.setTime(date.getTime() + days * 24 * 60 * 60 * 1000);
                const expires = "expires=" + date.toUTCString();
                document.cookie = name + "=" + value + ";" + expires + ";path=/";
            }

            function getCookie(name) {
                const cookieName = name + "=";
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    let cookie = cookies[i].trim();
                    if (cookie.indexOf(cookieName) === 0) {
                        return cookie.substring(cookieName.length, cookie.length);
                    }
                }
                return "";
            }

            window.login = login;
        });
    </script>
</body>
</html>
