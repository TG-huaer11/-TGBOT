<style>
    .fixed-table-container .bs-checkbox .th-inner {
        padding: 8px 40px !important;
    }

    .fixed-table-body {
        overflow-y: visible !important;
        overflow-x: visible !important;
    }
    .dropdown-menu-right{
        top: 0 !important;
    }
</style>
<div class="panel panel-default panel-intro">

    <div class="panel-heading">
        <ul class="nav nav-tabs" data-field="status">
            <li class="active"><a href="#t-all" data-value="" data-toggle="tab">{:__('All')}</a></li>
            {foreach name="statusList" item="vo"}
            <li><a href="#t-{$key}" data-value="{$key}" data-toggle="tab">{$vo}</a></li>
            {/foreach}
        </ul>
    </div>

    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">

                    <div id="toolbar" class="toolbar">
                        {:build_toolbar('refresh,add')}
                        {if $template == 'default'}
                        <a class="btn btn-danger btn-multi btn-disabled disabled" href="javascript:;"
                           data-params="status=2">{:__('Status 2')}</a>

                        <a class="btn btn-success btn-multi btn-disabled disabled" href="javascript:;"
                           data-params="status=1">{:__('Status 1')}</a>
                        <a class="btn btn-success btn-money btn-disabled disabled" href="javascript:;" data-value="add">
                            {:__('Money')}</a>
                        <a class="btn btn-danger btn-money btn-disabled disabled" href="javascript:;" data-value="sub">
                            {:__('Deduction')}</a>
                        {/if}
                        <a class="btn btn-success" href="javascript:;" >{$invite_code}</a>
                        <a class="btn btn-success copy" href="javascript:;" data-clipboard-action="copy" data-clipboard-text="https://venice-mall.xyz/h5/#/pages/login/register?invite_code={$invite_code2}" class="copy ">复制链接</a>
                        
                        
                         <!--  <a class="btn btn-danger btn-multi" href="{:url('kd/index')}"
                          >批量卡单</a>-->
                          
                    </div>
                    <style>


        .search-container {
            display: flex;
            align-items: center;
            background-color: #f4f4f4;
            padding: 10px;
            border-radius: 5px;
            width: fit-content;
        }

        .search-container select,
        .search-container input[type="text"],
        .search-container button {
            margin: 0 15px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        .search-container button {
            background-color: #007BFF;
            color: white;
            cursor: pointer;
        }

        .search-container button:hover {
            background-color: #0056b3;
        }
        .search-form {
    display: none;
}
    </style>
<form id="custom-search-form">
<div class="search-container">
     {if $admin.id==1}
        <label for="search-type">归属:</label>
        <select id="top_id" name="">
            <option value="0">全部</option>
           {volist name="agent_list" id="item"}
            <option value="{$item.user_id}">{$item.username}</option>
              {/volist}
        </select>
    {/if}
        <label for="member-id">会员 ID:</label>
        <input type="text" id="member_id" placeholder="输入会员 ID">
        <label for="username">用户名:</label>
        <input type="text" id="username" placeholder="输入用户名">
        <label for="identity">身份:</label>
        <select id="jia">
            <option value="all">全部</option>
            <option value="0">真人</option>
            <option value="1">假人</option>
        </select>
        <button type="submit" style="padding: 10px 30px;">搜索</button>
    </div>
</form>
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                           data-operate-edit="{:$auth->check('user.user/edit')}"
                           data-operate-del="{:$auth->check('user.user/del')}"
                           width="100%">
                    </table>

                </div>
            </div>
        </div>
        
        
    </div>
</div>
