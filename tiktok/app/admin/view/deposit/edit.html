<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    {if $status == 2 || $status == 3 || $status == 33}
     <div class="form-group">
        <label for="c-remark" class="control-label col-xs-12 col-sm-2">用户名:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-address" readonly class="form-control" type="text" value="{$row.uid|findpp=###}">
        </div>
    </div>
     <div class="form-group">
        <label for="c-remark" class="control-label col-xs-12 col-sm-2">上级代理:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-address" readonly class="form-control" type="text" value="{$row.uid|findppp=###}">
        </div>
    </div>
    <div class="form-group">
        <label for="c-remark" class="control-label col-xs-12 col-sm-2">{:__('提现地址')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-address" readonly class="form-control" type="text" value="{$row.address_info.address}">
        </div>
    </div>
     <div class="form-group">
        <label for="c-remark" class="control-label col-xs-12 col-sm-2">提款金额:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-address" readonly class="form-control" type="text" value="{$row.real_num}">
        </div>
    </div>
  
    {/if}

    {if $status == 3}
  <div class="form-group">
        <label for="c-remark" class="control-label col-xs-12 col-sm-2">{:__('拒绝理由')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-remark" data-rule="required" class="form-control" name="row[remark]" type="text" value="">
        </div>
    </div>
    {/if}

    {if  $status == 33}
    <div class="form-group">
        <label for="c-withdraw_time" class="control-label col-xs-12 col-sm-2">{:__('禁止提款时间')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-withdraw_time" data-rule="required" class="form-control" name="row[withdraw_time]" type="number" value="">
        </div>
    </div>
    {/if}

    {if $status == 4}
    <div class="form-group">
        <label for="c-pay" class="control-label col-xs-12 col-sm-2">{:__('Pay.name2')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-pay" data-rule="required" class="form-control selectpage" data-source="pay_out/index" data-params='{"custom[status]": "1"}' data-primary-key="name" name="row[pay]" type="text" value="">
        </div>
    </div>
    {/if}

    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
