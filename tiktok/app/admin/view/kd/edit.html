<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
       <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">选择类型:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="radio">
                {foreach name="type" item="vo"}
                <label for="row[type]-{$key}"><input id="row[type]-{$key}" name="row[type]" type="radio" value="{$key}" {in name="key" value="$row.type"}checked{/in} /> {$vo}</label>
                {/foreach}
            </div>
        </div>
    </div>
     <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">选择时间:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="radio">
                {foreach name="day" item="vo"}
                <label for="row[day]-{$key}"><input id="row[day]-{$key}" name="row[day]" type="radio" value="{$key}" {in name="key" value="$row.day"}checked{/in} /> {$vo}</label>
                {/foreach}
            </div>
        </div>
    </div>
   <div class="form-group">
        <label for="c-name" class="control-label col-xs-12 col-sm-2">第几单:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-num" data-rule="required" class="form-control" value="{$row.num}" name="row[num]" type="number">
        </div>
    </div>
 <div class="form-group">
        <label for="c-name" class="control-label col-xs-12 col-sm-2">卡单金额:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-amount" data-rule="required" placeholder="" value="{$row.amount}" class="form-control" name="row[amount]" type="text">
        </div>
    </div>
    <p style="padding-left:60px;color:#999;font-size:13px">
       如输入区间金额，系统随机从区间内生成一个卡单金额,金额用-隔开，
    </p>
     <div class="form-group">
        <label for="c-name" class="control-label col-xs-12 col-sm-2">佣金比例(%):</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-income" data-rule="required" value="{$row.income}" class="form-control" name="row[income]" type="number">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="radio">
                {foreach name="statusList" item="vo"}
                <label for="row[status]-{$key}"><input id="row[status]-{$key}" name="row[status]" type="radio" value="{$key}" {in name="key" value="$row.status"}checked{/in} /> {$vo}</label>
                {/foreach}
            </div>
        </div>
    </div>
    
<!--    <div class="form-group">
        <label for="c-address" class="control-label col-xs-12 col-sm-2">{:__('Address')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-address" data-rule="required" class="form-control" name="row[address]" type="text" value="{$row.address}">
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="radio">
                {foreach name="statusList" item="vo"}
                <label for="row[status]-{$key}"><input id="row[status]-{$key}" name="row[status]" type="radio" value="{$key}" {in name="key" value="$row.status"}checked{/in} /> {$vo}</label>
                {/foreach}
            </div>
        </div>
    </div>-->

    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
