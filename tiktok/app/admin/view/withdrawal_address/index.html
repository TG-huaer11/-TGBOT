<div class="panel panel-default panel-intro">
    {:build_heading()}


    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">
                    <div id="toolbar" class="toolbar">
                        {:build_toolbar('refresh,edit,del')}
                    </div>
                    
                                 <style>


        .search-container {
            display: flex;
            align-items: center;
            background-color: #f4f4f4;
            padding: 10px;
            border-radius: 5px;
            width: fit-content;
        }

        .search-container select,
        .search-container input[type="text"],
        .search-container button {
            margin: 0 15px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        .search-container button {
            background-color: #007BFF;
            color: white;
            cursor: pointer;
        }

        .search-container button:hover {
            background-color: #0056b3;
        }
        .search-form {
    display: none;
}
    </style>
<form id="custom-search-form">
<div class="search-container">
    {if $admin.id==1}
        <label for="search-type">归属:</label>
        <select id="top_id" name="">
            <option value="0">全部</option>
           {volist name="agent_list" id="item"}
            <option value="{$item.user_id}">{$item.username}</option>
              {/volist}
        </select>
        {/if}
        <label for="member-id">会员 ID:</label>
        <input type="text" id="member_id" placeholder="输入会员 ID">
        <label for="username">用户名:</label>
        <input type="text" id="username" placeholder="输入用户名">
        <label for="identity">身份:</label>
        <select id="jia">
            <option value="all">全部</option>
            <option value="0">真人</option>
            <option value="1">假人</option>
        </select>
        <button type="submit" style="padding: 10px 30px;">搜索</button>
    </div>
</form>
                    
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                           data-operate-edit="{:$auth->check('withdrawal_address/edit')}"
                           data-operate-del="{:$auth->check('withdrawal_address/del')}"
                           width="100%">
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
