<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
   
   <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">选择语言:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="radio">
                {foreach name="lang" item="vo"}
                <label for="row[lang]-{$key}"><input id="row[lang]-{$key}" name="row[lang]" type="radio" value="{$key}" {in name="key" value="1"}checked{/in} /> {$vo}</label>
                {/foreach}
            </div>
        </div>
    </div>


    <div class="form-group">
        <label for="c-content" class="control-label col-xs-12 col-sm-2">{:__('Content')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-content" data-rule="required" class="form-control" name="row[content]" type="text" value="">
        </div>
    </div>
    
  

    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
