<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label for="c-name" class="control-label col-xs-12 col-sm-2">{:__('Name')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-name" data-rule="required" class="form-control" name="row[name]" type="text" value="{$row.name}">
        </div>
    </div>

    <div class="form-group">
        <label for="c-bili" class="control-label col-xs-12 col-sm-2">{:__('Bili')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-bili" data-rule="required" class="form-control" name="row[bili]" type="text" value="{$row.bili}">
        </div>
    </div>

    <div class="form-group">
        <label for="c-cate_info" class="control-label col-xs-12 col-sm-2">{:__('Cate_info')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea data-rule="required" name="row[cate_info]" id="c-cate_info" cols="60" rows="5" class="form-control">{$row.cate_info}</textarea>
        </div>
    </div>

    <div class="form-group">
        <label for="c-min" class="control-label col-xs-12 col-sm-2">{:__('Min')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-min" data-rule="required" class="form-control" name="row[min]" type="text" value="{$row.min}">
        </div>
    </div>

    <div class="form-group">
        <label for="c-level_id" class="control-label col-xs-12 col-sm-2">{:__('Level_id')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-level_id" data-rule="required" class="form-control" name="row[level_id]" type="text" value="{$row.level_id}">
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Cate_pic')}:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-cate_pic" data-rule="required" class="form-control" size="50" name="row[cate_pic]" type="text" value="{$row.cate_pic}">
                <div class="input-group-addon no-border no-padding">
                    <span><button type="button" id="faupload-cate_pic" class="btn btn-danger faupload" data-input-id="c-cate_pic" data-mimetype="image/gif,image/jpeg,image/png,image/jpg,image/bmp,image/webp" data-multiple="true" data-preview-id="p-cate_pic"><i class="fa fa-upload"></i> {:__('Upload')}</button></span>
                    <span><button type="button" id="fachoose-cate_pic" class="btn btn-primary fachoose" data-input-id="c-cate_pic" data-mimetype="image/*"><i class="fa fa-list"></i> {:__('Choose')}</button></span>
                </div>
                <span class="msg-box n-right" for="c-cate_pic"></span>
            </div>
            <ul class="row list-inline faupload-preview" id="p-cate_pic"></ul>
        </div>
    </div>

    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
