<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label for="c-name" class="control-label col-xs-12 col-sm-2">{:__('Name')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-name" data-rule="required" class="form-control" name="row[name]" type="text" value="{$row.name}">
        </div>
    </div>

    <div class="form-group">
        <label for="c-order_num" class="control-label col-xs-12 col-sm-2">{:__('Order_num')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-order_num" data-rule="required" class="form-control" name="row[order_num]" type="text" value="{$row.order_num}">
        </div>
    </div>

    <div class="form-group">
        <label for="c-bili" class="control-label col-xs-12 col-sm-2">{:__('Bili')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-bili" data-rule="required" class="form-control" name="row[bili]" type="text" value="{$row.bili}">
        </div>
    </div>

    <div class="form-group">
        <label for="c-commission" class="control-label col-xs-12 col-sm-2">{:__('Commission')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-commission" data-rule="required" class="form-control" name="row[commission]" type="text" value="{$row.commission}">
        </div>
    </div>

    <div class="form-group">
        <label for="c-tixian_shouxu" class="control-label col-xs-12 col-sm-2">{:__('Tixian_shouxu')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-tixian_shouxu" data-rule="required" class="form-control" name="row[tixian_shouxu]" type="text" value="{$row.tixian_shouxu}">
        </div>
    </div>

    <div class="form-group">
        <label for="c-tixian_min" class="control-label col-xs-12 col-sm-2">{:__('Tixian_min')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-tixian_min" data-rule="required" class="form-control" name="row[tixian_min]" type="text" value="{$row.tixian_min}">
        </div>
    </div>

    <div class="form-group">
        <label for="c-tixian_max" class="control-label col-xs-12 col-sm-2">{:__('Tixian_max')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-tixian_max" data-rule="required" class="form-control" name="row[tixian_max]" type="text" value="{$row.tixian_max}">
        </div>
    </div>

    <div class="form-group">
        <label for="c-pic" class="control-label col-xs-12 col-sm-2">图片:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-pic" data-rule="" class="form-control" size="50" name="row[pic]" type="text" value="{$row.pic}">
                <div class="input-group-addon no-border no-padding">
                    <span><button type="button" id="faupload-pic" class="btn btn-danger faupload" data-input-id="c-pic" data-mimetype="image/gif,image/jpeg,image/png,image/jpg,image/bmp" data-multiple="false" data-preview-id="p-pic"><i class="fa fa-upload"></i> 上传</button></span>
                    <span><button type="button" id="fachoose-pic" class="btn btn-primary fachoose" data-input-id="c-pic" data-mimetype="image/*" data-multiple="false"><i class="fa fa-list"></i> 选择</button></span>
                </div>
                <span class="msg-box n-right" for="c-pic"></span>
            </div>
            <ul class="row list-inline faupload-preview" id="p-pic"></ul>
        </div>
    </div>

    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
