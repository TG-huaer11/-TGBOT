<script>
    $(() => {
        let param = {
            tag: true,
            num: 1,
            ele: document.createElement('div'),
            icon: 'fa fa-comments-o',
            homeIcon: 'fa-telegram',
            moreIcon: '&#xe627;',
            personalIcon: 'fa-whatsapp',
            closeIcon: 'fa-dot-circle-o',
            distance: '500',
            css: "position:fixed;" +
                "bottom:11%;" +
                "right:10px;" +
                // "display:none;" +
                "font-size:0.8rem;" +
                "color:#fff;" +
                "z-index:1000;" +
                "height:1.25rem;" +
                "width:1.25rem;" +
                "background:#f44336;" +
                "border-radius:50%;" +
                "line-height:1.25rem;" +
                "text-align:center",
            menuCss: "position:absolute;" +
                // "bottom:3rem;" +
                "display:none;" +
                "font-size:0.8rem;" +
                "color:#fff;" +
                "background:orange;" +
                "height:1rem;" +
                "width:1rem;" +
                "border-radius:50%;" +
                "text-align:center;" +
                "line-height:1rem;"
            // type: '#top'
        };

        {
            document.querySelector('body').appendChild(((ele) => {
                ele.className = 'fa ' + param.icon;
                // ele.innerHTML = param.moreIcon;
                // ele.href = param.type;
                ele.style.cssText = param.css;
                for (let i = 0; i < 2; i++) {
                    let menu_personal = document.createElement('a');
                    menu_personal.style.cssText = param.menuCss;

                    switch (i) {
                        case 0:
                            setStyle(menu_personal, '#2196f3', '1.3rem', '0.9rem', param.homeIcon, 'telegram');
                            break;

                        case 1:
                            setStyle(menu_personal, '#4caf50', 0, '1.55rem', param.personalIcon, 'whatapps');
                            break;

                    }

                    param.ele.appendChild(menu_personal);


                }
                return ele;
            })(param.ele));

            function setStyle(ele, ...args) {
                ele.style.background = args[0];
                ele.style.bottom = args[1];
                ele.style.right = args[2];
                ele.className = 'fa ' + args[3];
                ele.id = args[4];
            }

        }
        {
            $(param.ele).click((e) => {
                window.e = e;
                console.log(e.target.id)
                switch (e.target.id) {
                    case 'telegram':
                        window.open('{$tg}', '_blank')
                        break;
                    case 'whatapps':
                        window.open('{$ws}', '_blank')
                        break;
                }
                if (param.num % 2 == 0) {
                    $(param.ele).children().css('display', 'none')
                } else {
                    $(param.ele).children().css('display', 'block');
                }
                param.num++;

            })
        }
    });
</script>
