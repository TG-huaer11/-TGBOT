                //return false;
            }
            if ($("input[name=invite_code]").val() == '') {
                //$(document).dialog({infoText: '请输入邀请码'});
                //return false;
            }
            return true;
        }

        /*手机号码验证*/
        function check_phone() {
            if ($("input[name=user_name]").val() == '') {
                $(document).dialog({infoText: '{:__("Please enter username")}'});
                return false;
            }
            var myreg = /^([0-9|A-Z|a-z]|[\u4E00-\u9FA5\uF900-\uFA2D]){2,12}$/;
            if (!myreg.test($("input[name=user_name]").val())) {
                $(document).dialog({infoText: '{:__("User name enter error, 2-12 letters or numbers required")}'});
                return false;
            }
            if ($("input[name=tel]").val() == '') {
                $(document).dialog({infoText: '{:__("Please enter your mobile phone number")}'});
                return false;
            }
            var tel = $("input[name=tel]").val();
            if (tel.length < 6) {
                $(document).dialog({infoText: '{:__("Mobile phone number input error")}'});
                return false;
            }
            return true;
        }

        /*提交*/
        $(".form-buttom").on('click', function () {
            var data = {
                username: $("input[name='username']").val(),
                verify_code: $("input[name='verify_code']").val(),
                country_code: $("#countryCode").val(),
                tel: $("input[name='tel']").val(),
                deposit_pwd: $("input[name='deposit_pwd']").val(),
                pwd: $("input[name='pwd']").val(),
                // email: $("input[name='email']").val(),
                invite_code: $("input[name='invite_code']").val(),
            }
            if (check()) {
                $.ajax({
                    url: "{:url('user/register')}",
                    data: data,
                    type: 'POST',
                    beforeSend: function () {
                        loading = $(document).dialog({
                            type: 'notice',
                            infoIcon: '__CDN__/assets/{$template}/img/loading.gif',
                            infoText: '{:__("loading")}',
                            autoClose: 0
                        });
                    },
                    success: function (data) {
                        loading.close();
                        if (data.code === 1) {
                            $(document).dialog({infoText: '{:__("signup success")}'});
                            setTimeout(function () {
                                location.href = "{:url('index/index')}"
                            }, 1500);
                        } else {
                            $(document).dialog({infoText: data.msg});
                        }
                    }
                });
            }
            return false;
        })
    })
</script>
