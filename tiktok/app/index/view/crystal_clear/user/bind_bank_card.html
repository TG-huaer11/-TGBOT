<div id="app" class="pad-top-1-2">
    <div data-v-cc2885a2="" class="main">
        <div data-v-61ea9512="" class="header">
            <div class="left_btn" onclick="onBack()">
                <img src="__CDN__/assets/crystal_clear/img/back.png" alt="" class="return"/>
            </div>
            <div data-v-4c2dcb20="" class="Maintitle">
                <h3 data-v-4c2dcb20="">
                    {:__("Bank_Title")}
                </h3>
            </div>
            <div class="right_btn" onclick="onDel()" style="padding-top: 2px" v-if="del == 1">
                Del
            </div>
        </div>

        <!-- Binded -->

        <div class="group3 flex-col">
            <div class="mod1 flex-row">
                <span class="word3">{:__("Bank_Bank")}</span>
            </div>
            <div class="mod2 flex-row justify-between">
                <span class="txt2">{{info.card}}</span>
            </div>
            <div class="mod3 flex-row justify-between">
                <span class="info2">{:__("Bank_IFSC")}</span>
                <span class="txt3">{{info.ifsc}}</span>
            </div>
            <div class="mod4 flex-row justify-between">
                <span class="word4">{:__("Bank_Name")}</span>
                <span class="txt4">{{info.username}}</span>
            </div>
        </div>
    </div>
</div>
<script type="application/javascript">
    function onBack() {
        location.href = "/user/personal";
    }
</script>
<div v-if="del == 1">
    <script type="application/javascript">
        function onDel() {
            $.ajax({
                url: "/user/bind_bank_del",
                type: "POST",
                beforeSend: function () {
                    loading = $(document).dialog({
                        type: "notice",
                        infoIcon: "__CDN__/assets/common/img/loading.gif",
                        infoText: "loading",
                        autoClose: 0,
                    });
                },
                success: function (data) {
                    if (data.code == 401) {
                        $(document).dialog({
                            infoText: data.msg,
                            autoClose: 2000
                        });
                        setTimeout(function () {
                            window.location.href = '/user/login'
                        }, 2000)
                        return false
                    }
                    if (data.code == 1) {
                        $(document).dialog({infoText: "Success"});
                        setTimeout(function () {
                            window.location.reload();
                        }, 2000);
                    } else {
                        loading.close();
                        $(document).dialog({infoText: 'Error'});
                    }
                },
            });
        }
    </script>
</div>
<script>
    const app = Vue.createApp({
        setup() {
            const del = Vue.ref([]);
            const info = Vue.ref([]);

            const getBankInfo = () => {
                axios.post('/user/bind_bank').then(function (result) {
                    // 加载状态结束
                    var res = result.data
                    if (res.code) {
                        del.value = res.data.del
                        info.value = res.data.info
                    }
                })
            }
            getBankInfo()
            return {
                del,
                info,
                getBankInfo     ,
            };
        },
    });
    app.use(vant);
    app.use(vant.Toast);
    app.mount("#app");
</script>
</body>
