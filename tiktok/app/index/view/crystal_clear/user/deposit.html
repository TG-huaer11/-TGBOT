    .save-btn {

        padding: 10px;

        cursor: pointer;
        border-radius: 5px;
        text-align: center;
        font-size: 14px;
        background: #1989fa !important;
    }

    .money-bg {
        margin-right: 15px;
        margin-left: 15px;
        border-radius: 10px;
        margin-top: 10px;
        background-color: #fff;
        position: relative;
    }

    .money-bg > p {
        padding: 10px;
    }

    .money-bg > input {
        font-size: 28px;
        border: none;
        width: 70%;
        margin: 10px 10px 20px 50px;
        background-color: #fff;
    }

    .money-bg > span {
        position: absolute;
        left: 20px;
        bottom: 55px;
        font-size: 22px;
    }

    .balance {

    }

    .rate {

        border-radius: 2500px;
        color: #fff;

    }

    .right {

<script type="application/javascript">
    function tixianAll() {
        var price = $('.user_balance').html()
        $('#num').val(price);
    }

    $(function () {
        if ($("input[name=bank_account]").val() == '****') {
            loading = $(document).dialog({
                type: 'notice',
                infoIcon: '__CDN__/assets/common/img/loading.gif',
                infoText: 'loading',
                autoClose: 0
            });
            loading.close();
            $(document).dialog({infoText: '{:__("Unbound bank card, go to bind!")}'});
            setTimeout(function () {
                window.location.href = '/user/bind_bank';
            }, 2000);
        }

        /*检查表单*/
        function check() {
            if ($("input[name=num]").val() == '') {
                $(document).dialog({infoText: '{:__("Amount empty")}'});
                return false;
            }
            if ($("input[name=paypassword]").val() == '') {
                $(document).dialog({infoText: '{:__("Please input pay password")}'});
                return false;
            }
            return true;
        }

        /*点击登录*/
        $(".save-btn").on('click', function () {
            if (check()) {
                var loading = null;
                $.ajax({
                    url: '/user/do_deposit',
                    data: $("#login-form").serialize(),
                    type: 'POST',
                    beforeSend: function () {
                        loading = $(document).dialog({
                            type: 'notice',
                            infoIcon: '__CDN__/assets/common/img/loading.gif',
                            infoText: 'loading',
                            autoClose: 0
                        });
                    },
                    success: function (data) {
                        loading.close();
                        if (data.code == 401) {
                            $(document).dialog({
                                infoText: data.msg,
                                autoClose: 2000
                            });
                            setTimeout(function () {
                                window.location.href = '/user/login'
                            }, 2000)
                            return false
                        }
                        if (data.code == 1) {
                            $(document).dialog({infoText: 'Success!'});
                            setTimeout(function () {
                                window.location.href = '/user/deposit';
                            }, 2000);
                        } else {
                            $(document).dialog({infoText: data.msg});
                        }
                    }
                });
            }
        })
        $.ajax({
            url: '/user/deposit',
            type: 'POST',
            success: function (res) {
                if (res.code == 401) {
                    $(document).dialog({
                        infoText: res.msg,
                        autoClose: 2000
                    });
                    setTimeout(function () {
                        window.location.href = '/user/login'
                    }, 2000)
                    return false
                }
                if (res.code == 1) {

                    console.log(res.data)
                    var status = res.data.status

                    if (status.code == 1) {
                        $(".status1").css('display','block')
                        $('.status_t').html(status.t)
                    } else {
                        $(".status0").css('display','block')
                    }
                    var info = res.data.info
                    $(".bank_account").html(info.cardnum)
                    if (info.cardnum == '****') {
                        loading = $(document).dialog({
                            type: 'notice',
                            infoIcon: '__CDN__/assets/common/img/loading.gif',
                            infoText: 'loading',
                            autoClose: 0
                        });
                        loading.close();
                        $(document).dialog({infoText: '{:__("Unbound bank card, go to bind!")}'});
                        setTimeout(function () {
                            window.location.href = '/user/bind_bank';
                        }, 2000);
                    }
                    $(".shop").html(res.data.shop)
                    $(".limit").html(res.data.limit)
                    var user = res.data.user;
                    $(".user_balance").html(user.balance)
                    $(".shouxu").html(res.data.shouxu * 100)
                }
            }
        })
    })


</script>
