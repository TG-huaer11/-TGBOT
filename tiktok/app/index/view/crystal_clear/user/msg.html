<script>
    const app = Vue.createApp({
        setup() {
            const info = Vue.ref([]);
            const isLoading = Vue.ref(true);

            const getInfo = () => {
                axios.post('/user/msg').then(function (result) {
                    // 加载状态结束
                    var res = result.data
                    if (res.code == 401) {
                        $(document).dialog({
                            infoText: res.msg,
                            autoClose: 2000
                        });
                        setTimeout(function () {
                            window.location.href = '/user/login'
                        }, 2000)
                        return false
                    }
                    if (res.code) {
                        info.value = res.data.info
                        isLoading.value = false
                    }
                })
            }
            getInfo()
            return {
                info,
                isLoading,
                getInfo
            };
        },
    });
    app.use(vant);
    app.use(vant.Toast);
    app.mount("#app");
</script>
