<script type="application/javascript">
    $(function () {
        var countdown = 60;
        var flag = true;
        var loading = null;

        /*检查表单*/
        function check() {
            if (!check_phone()) return false;

            if ($("input[name=verify]").val() == "") {
                $(document).dialog({
                    infoText: '{:__("please enter verify code")}',
                });
                return false;
            }

            if (
                $("input[name=pwd]").val() == "" ||
                $("input[name=pwd_re]").val() == ""
            ) {
                $(document).dialog({
                    infoText: '{:__("please enter login password")}',
                });
                return false;
            }
            if ($("input[name=pwd]").val() !== $("input[name=pwd_re]").val()) {
                $(document).dialog({
                    infoText: '{:__("The passwords entered twice are inconsistent")}',
                });
                return false;
            }
            return true;
        }

        /*手机号码验证*/
        function check_phone() {
            if ($("input[name=tel]").val() == "") {
                $(document).dialog({
                    infoText: '{:__("Please enter your mobile phone number")}',
                });
                return false;
            }
            var tel = $("input[name=tel]").val();
            if (tel.length < 10) {
                $(document).dialog({
                    infoText: '{:__("Mobile phone number enter error")}',
                });
                return false;
            }
            return true;
        }

        /*验证码倒计时*/
        function time_down(obj) {
            if (countdown == 0) {
                flag = true;
                obj.text('{:__("Send Code")}');
                countdown = 60;
                return;
            } else {
                flag = false;
                obj.text(countdown + "s");
                countdown--;
            }
            setTimeout(function () {
                time_down(obj);
            }, 1000);
        }
