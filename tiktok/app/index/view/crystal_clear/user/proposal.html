{include file="public/header" /}
<style type="text/css" title="fading circle style">
    .circle-color-8 > div::before {
        background-color: #ccc;
    }

    textarea {
        color: #ffffff;
        background-color: #ffffff;
    }
</style>
<div id="app" class="pad-top-1-2">
    <div data-v-61ea9512="" class="main">
        <div data-v-4c2dcb20="" class="header">
            <div class="left_btn" onclick="window.history.back(-1)">
                <img src="__CDN__/assets/crystal_clear/img/back.png" alt="" class="return"/>
            </div>
            <div data-v-4c2dcb20="" class="Maintitle">
                <h3 data-v-4c2dcb20="">
                    {:__("Proposal_Title")}
                </h3>
            </div>
        </div>

        <div data-v-61ea9512="" class="bink_card">
            <h3 data-v-61ea9512="" style="margin-top: 10px">
                {:__("Proposal_Your_comments_or_suggestions")}:
            </h3>
            <ul data-v-61ea9512="" class="bink_card_ul">
                <li data-v-61ea9512="">
                <textarea rows="15" cols="45" placeholder='{:__("Proposal_text")}' id="form-text"></textarea>
                </li>
            </ul>
            <p data-v-cc2885a2="" style="padding: 20px; color: #fffdff">
                {:__("Proposal_Tip")}
            </p>
        </div>

        <button data-v-61ea9512="" onclick="submit()" id="submit" class="form-buttom">
            {:__("Proposal_Submit")}
        </button>
    </div>
</div>
<script type="application/javascript">
    function submit() {
        var text = $("#form-text").val();
        if (text == "" || text == null) {
            $(document).dialog({
                infoText: '{:__("Submitted information cannot be empty")}',
            });
        } else {
            $(document).dialog({infoText: '{:__("Submit Success")}'});
            window.location.href = "/user/index";
        }
    }
</script>
</body>
</html>
