<script type="application/javascript">
    $(function () {
        /*检查表单*/
        function check() {
            if ($("input[name=username]").val() == '' || $("input[name=pwd]").val() == '') {
                $(document).dialog({ infoText: '{:__("please input username/password")}' });
                return false;
            }
            return true;
        }

        /*监听账号input*/
        $("input[name=username]").bind("input propertychange", function () {
            if ($(this).val() !== '') {
                $('.icon-delete').show();
            } else {
                $('.icon-delete').hide();
            }
        });

        /*点击删除icon*/
        $(".icon-delete").on('click', function () {
            $("input[name=username]").val('');
            $('.icon-delete').hide();
        })

        /*显示or隐藏密码*/
        $(".icon-eye").on('click', function () {
            var type = $("input[name=pwd]").attr("type");
            if (type == 'pwd') {
                $("input[name=pwd]").attr('type', 'text');
                return;
            }
            $("input[name=pwd]").attr('type', 'pwd');
        });

        /*点击登录*/
        $(".login").on('click', function () {

            if (check()) {
                var loading = null;
                var username = $("input[name=username]").val();
                var pwd = $("input[name=pwd]").val();
                var remember = $("input[name=remember]").val();
                $.ajax({
                    url: "{:url('user/login')}",
                    data: { username: username, pwd: pwd, remember: remember },
                    type: 'POST',
                    beforeSend: function () {
                        loading = $(document).dialog({
                            type: 'notice',
                            infoIcon: '__CDN__/assets/{$template}/img/loading.gif',
                            infoText: '{:__("loading")}',
                            autoClose: 0
                        });
                    },
                    success: function (data) {
                        if (data.code == 1) {
                            loading.close();
                            $(document).dialog({ infoText: data.msg });
                            setTimeout(function () {
                                $(document).dialog({
                                    type: 'notice',
                                    infoIcon: '__CDN__/assets/{$template}/img/loading.gif',
                                    infoText: '{:__("loading")}',
                                    autoClose: 0
                                });
                                location.href = "{:url('index/index')}"
                            }, 2000);
                        } else {
                            loading.close();
                            if (data.msg) {
                                $(document).dialog({ infoText: data.msg });
                            } else {
                                $(document).dialog({ infoText: '{:__("The network is unstable. Please try again where the signal is good!")}', autoClose: 2000 });
                            }
                        }
                    },
                    error: function (data) {
                        loading.close();
                    }
                });
            }
        })
    })
</script>
